[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "study-sentinel"
version = "0.1.0"
description = "Offline auditable behavioral research analytics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<3"]
[project.optional-dependencies]
api = ["fastapi>=0.110,<1","uvicorn>=0.27,<1"]
test = ["pytest>=7,<10","httpx>=0.25,<1"]
[project.scripts]
study-sentinel = "study_sentinel.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
